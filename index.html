<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>婚禮桌位查詢</title>
<style>
    html, body {
        overflow: hidden; /* ✅ 隱藏滾輪 */
    }
    body {
        text-align: center;
        font-family: "Noto Serif TC", serif;
        color: #b68650;
    }
    h2 {
        margin-top: 60px;
        font-weight: 700;
    }
    .input-box {
        width: 60%;
        max-width: 400px;
        height: 60px;
        border: 3px solid #c49a6c;
        border-radius: 50px;
        margin: 30px auto 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    input {
        width: 80%;
        border: none;
        font-size: 20px;
        outline: none;
        text-align: center;
        color: #777;
    }
    .btn {
        margin-top: 0;
        margin-bottom: 40px;
        padding: 10px 30px;
        font-size: 18px;
        border-radius: 30px;
        background-color: #c98c4c;
        color: #fff;
        border: none;
        cursor: pointer;
    }
    .note {
        font-size: 16px;
        margin: 5px 0;
    }

    #result-area {
        margin-top: 60px;
        display: none;
        transition: all .3s ease;
    }
    .highlight {
        color: #e85a2b;
        font-weight: 700;
    }

    .table-wrapper {
        margin-top: 40px;
        position: relative;
        width: 260px;
        height: 260px;
        margin-left: auto;
        margin-right: auto;
    }
    #tableLabel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        font-weight: 700;
        color: #c49a6c;
        text-align: center;
    }
    .seat-dot {
        width: 32px;
        height: 32px;
        background-color: #d9b18b;
        border-radius: 50%;
        position: absolute;
    }
    .seat-dot.active {
        background-color: #e85a2b;
    }
</style>
</head>
<body>

<h2>請提供賓客大名查詢座位</h2>

<div class="input-box">
    <input id="guestName" placeholder="輸入姓名" />
</div>

<button class="btn" onclick="search()">查詢</button>

<p class="note">※ 一次請輸入一位賓客的姓名。</p>
<p class="note">※ 若為同行者查詢，請提供登記參加者姓名。</p>
<p class="note">※ 請使用中文字、完整真實姓名查詢。</p>
<p class="note">※ 外國賓客請使用半形英文全名查詢。</p>
<hr />


<div id="result-area">
    <p id="resultText" style="font-size:20px;"></p>

    <div class="table-wrapper">
        <div id="tableLabel">第 ? 桌</div>
    </div>
</div>

<script>
/* --- 假資料（新增 label 欄位） --- */
const guestData = {
    "王大明": { table: 1, count: 4, label: "主桌" },
    "陳小華": { table: 3, count: 2, label: "高中好友桌" },
    "John Doe": { table: 2, count: 10, label: "Bride’s Friends" },
};

/* --- 查詢主功能 --- */
function search() {
    const name = document.getElementById("guestName").value.trim();
    if (!name) {
        alert("請輸入姓名");
        return;
    }

    const data = guestData[name];
    const resultText  = document.getElementById("resultText");
    const resultArea  = document.getElementById("result-area");
    const tableLabel  = document.getElementById("tableLabel");

    if (!data) {
        resultText.innerHTML = `$1` + "<br><strong>▼下方看完整桌位圖▼</strong>";
        tableLabel.innerText = `第 ? 桌`;
        clearDots();
        resultArea.style.display = "block";
        return;
    }

    // 讀出資料
    const { table, count, label } = data;

    // 顯示文案 —— 加入 label
    resultText.innerHTML = `
        <span class="highlight">${name}</span> 您好，您的座位在 
        <br><span class="highlight">第 ${table} 桌</span>：
        <span class="highlight">${label}</span>，
        <br>含同行者共有 <span class="highlight">${count} 人</span>，
        <br>座位請至現場自行分配。
    `;

    // 顯示中央桌號
    tableLabel.innerText = `第 ${table} 桌`;

    // 顯示座位點
    generateDots(count);

    resultArea.style.display = "block";
}

/* 清除舊座位點 */
function clearDots() {
    document.querySelectorAll(".seat-dot").forEach(e => e.remove());
}

/* 建立座位點 */
function generateDots(count) {
    clearDots();
    const wrapper = document.querySelector(".table-wrapper");
    const radius = 110;

    for (let i = 0; i < 10; i++) {
        const dot = document.createElement("div");
        dot.classList.add("seat-dot");
        if (i < count) dot.classList.add("active");

        const angle = (i / 10) * (2 * Math.PI);
        const x = 130 + Math.cos(angle) * radius;
        const y = 130 + Math.sin(angle) * radius;

        dot.style.left = `${x - 16}px`;
        dot.style.top  = `${y - 16}px`;

        wrapper.appendChild(dot);
    }
}
</script>

<div id="imgModal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8);">
  <span id="closeModal" style="position:absolute; top:20px; right:30px; font-size:40px; color:#fff; cursor:pointer;">&times;</span>
  <img id="modalImg" style="display:block; margin:auto; max-width:90%; max-height:90%; margin-top:5%;" />
</div>
<script>
  document.querySelectorAll('img.zoomable').forEach(function(img){
    img.style.cursor='zoom-in';
    img.addEventListener('click', function(){
      document.getElementById('modalImg').src = this.src;
      document.getElementById('imgModal').style.display='block';
    });
  });
  document.getElementById('closeModal').onclick=function(){
    document.getElementById('imgModal').style.display='none';
  }
</script>
</body>
</html>
