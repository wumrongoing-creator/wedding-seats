<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💒 婚禮桌位查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
    /* 全域設定 */
    html, body {
        margin: 0;
        padding: 0;
        overflow-y: auto !important;
        height: auto !important;
        height: auto;
        min-height: 100%;
        box-sizing: border-box;
    }
    body {
        text-align: center;
        font-family: 'Noto Sans TC', sans-serif;
        color: #6C5B49; 
        background-color: #fcf8f3;
        padding: 20px 0;
    }

    /* 主內容區塊，設定最大寬度並居中 */
    .main-content-wrapper {
        max-width: 500px;
        margin: 0 auto;
        padding: 0 15px;
    }

    /* 貴賓您好！問候語 */
    .greeting {
        font-size: 20px;
        font-weight: 500;
        color: #9C7E5A;
        margin-bottom: 5px;
    }

    /* 標題 (H2) */
    h2 {
        margin-top: 0;
        margin-bottom: 20px;
        font-weight: 500; 
        font-size: 20px;
        color: #9C7E5A;
    }

    /* --- 輸入區和註釋區的共同容器 --- */
    .form-note-container {
        width: 90%;
        max-width: 400px;
        margin: 0 auto;
    }

    /* 輸入框和按鈕的 Flex 容器 */
    .input-group {
        display: flex;
        align-items: center;
        gap: 10px; 
        margin: 10px auto 20px;
    }

    /* 輸入框區塊 */
    .input-box {
        flex-grow: 1; 
        height: 50px;
        border: 2px solid #C49A6C; 
        border-radius: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fff;
        box-sizing: border-box;
    }
    input {
        width: 90%; 
        border: none;
        font-size: 16px; 
        outline: none;
        text-align: center;
        color: #777;
        font-family: 'Noto Sans TC', sans-serif;
    }
    input::placeholder {
        color: #C49A6C; 
        font-weight: 300;
    }

    /* 按鈕 */
    .btn {
        padding: 10px 20px;
        font-size: 16px;
        font-weight: 500;
        border-radius: 25px;
        background-color: #C98C4C; 
        color: #fff;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
        box-shadow: none; 
        height: 50px; 
        flex-shrink: 0;
    }
    .btn:hover {
        background-color: #b6763c;
    }

    /* 註釋 */
    .note {
        font-size: 14px;
        color: #666666;
        margin: 5px 0;
        text-align: left;
    }
    hr {
        width: 85%; 
        max-width: 600px; 
        border: none;
        border-top: 1px solid #e0d8cf;
        margin: 20px auto;
    }

    /* 結果區 */
    #result-area {
        margin-top: 50px; 
        padding-bottom: 20px;
        display: block; 
    }

    /* 查詢結果卡片區塊 (名片) */
    #resultCard {
        width: 90%;
        max-width: 360px; 
        margin: 30px auto 0;
        padding: 20px; 
        border: 2px solid #C49A6C; 
        border-radius: 25px;
        text-align: left; 
        line-height: 1.8;
        opacity: 1; 
        transition: opacity .3s ease;
    }

    /* 卡片內文字區塊 */
    #resultText {
        font-size: 16px;
        line-height: 1.6;
        padding: 0;
        text-align: left;
        padding-left: 10px; 
    }
    .highlight {
        color: #E85A2B; 
        font-weight: 700;
        font-size: 18px;
    }
    .name-highlight {
        font-size: 18px;
        font-weight: 700;
        color: #E85A2B;
    }

    /* 桌位圖區塊 */
    .table-wrapper {
        margin-top: 40px; 
        position: relative;
        width: 280px;
        height: 280px;
        margin-left: auto;
        margin-right: auto;
        border: none;
        border-radius: 50%;
        background-color: transparent; 
    }
    .table-wrapper::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 143px; 
        height: 143px; 
        background-color: #fcf8f3; 
        border-radius: 50%;
        border: 2px solid #D9B18B; 
    }

    #tableLabel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 26px; 
        font-weight: 700;
        color: #9C7E5A;
        line-height: 1.2; 
        z-index: 10; 
        text-align: center;
    }
    #tableLabel span {
        display: block; 
        font-size: 15px; 
        font-weight: 500;
        margin-top: 3px; 
        color: #9C7E5A;
    }

    .seat-dot {
        width: 30px;
        height: 30px;
        background-color: #fff; 
        border: 2px solid #D9B18B; 
        border-radius: 50%;
        position: absolute;
        transition: background-color 0.3s ease;
    }
    .seat-dot.active {
        background-color: #E85A2B; 
        border: none; 
        box-shadow: none; 
    }

    .note-below-table {
        font-size: 14px;
        color: #6C5B49;
        margin-top: 20px;
        display: none; 
    }

    /* --- 新增：底部功能按鈕樣式 --- */
    .button-area {
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
    }

    .secondary-btn {
        background-color: #d8c0a7;
        color: #6C5B49;
    }
    .secondary-btn:hover {
        background-color: #c5ad8f;
    }

    .link-btn {
        background-color: #E85A2B;
    }
    .link-btn:hover {
        background-color: #cc4f26;
    }

</style>
</head>
<body>

<div class="main-content-wrapper">

    <p class="greeting">貴賓您好！</p>
    <h2>請提供賓客大名以查詢座位</h2>

    <div class="form-note-container">

        <div class="input-group">
            <div class="input-box">
                <input id="guestName" placeholder="輸入姓名" />
            </div>
            <button class="btn" onclick="search()">查詢</button>
        </div>

        <p class="note">※ 一次請輸入一位賓客的姓名。</p>
        <p class="note">※ 若為同行者查詢，請提供登記參加者姓名。</p>
        <p class="note">※ 請使用中文字、完整真實姓名查詢。</p>
        <p class="note">※ 外國賓客請使用半形英文全名查詢。</p>
    </div>

    <hr />

    <div class="table-wrapper">
        <div id="tableLabel"></div> 
    </div>

    <p id="tableNoteBelow" class="note-below-table">※ 座位請至現場自行分配 ※</p>

    <div id="result-area">
        <div id="resultCard" class="result-card">
            <p id="resultText">
                <span class="name-highlight">ＯＯＯ</span> 您好！
                <br>您的桌位：<span class="highlight">第 Ｏ 桌</span>
                <br>桌位名稱：<span class="highlight">Ｏ 桌</span>
                <br>含同行者：<span class="highlight">共 Ｏ 人</span>
            </p>
        </div>
    </div>

    <!-- 新增功能按鈕區 -->
    <div class="button-area">
        <button class="btn secondary-btn" onclick="resetSearch()">↺ 重新輸入搜尋</button>
        <button class="btn link-btn" onclick="window.open('https://sites.google.com/view/wedding-seats-await/view', '_blank')">
            查看座位分布大圖
        </button>
    </div>

</div>

<script>
/* --- 假資料 --- */
const guestData = {
    "王大明": { table: 1, count: 4, label: "主桌 / 雙方家長" },
    "陳小華": { table: 3, count: 2, label: "高中好友桌" },
    "John Doe": { table: 2, count: 10, label: "Bride’s Friends" }, 
    "林志玲": { table: 15, count: 6, label: "大學同學" },
    "劉德華": { table: 8, count: 1, label: "現任同事" },
};

const defaultResultHTML = `
    <span class="name-highlight">ＯＯＯ</span> 您好！
    <br>您的桌位：<span class="highlight">第 Ｏ 桌</span>
    <br>桌位名稱：<span class="highlight">Ｏ 桌</span>
    <br>含同行者：<span class="highlight">共 Ｏ 人</span>
`;

document.addEventListener('DOMContentLoaded', () => {
    generateDots(0); 
});

function search() {
    const name = document.getElementById("guestName").value.trim();
    const resultArea = document.getElementById("result-area");
    const resultText  = document.getElementById("resultText");
    const tableLabel  = document.getElementById("tableLabel");
    const tableNoteBelow = document.getElementById("tableNoteBelow");

    if (!name) {
        alert("請輸入姓名");
        return;
    }

    const data = guestData[name];
    tableNoteBelow.style.display = 'none';

    setTimeout(() => { 
        if (!data) {
            resultText.innerHTML = defaultResultHTML;
            tableLabel.innerHTML = ''; 
            clearDots();
            generateDots(0); 
        } else {
            const { table, count, label } = data;
            resultText.innerHTML = `
                <span class="name-highlight">${name}</span> 您好！
                <br>您的桌位：<span class="highlight">第 ${table} 桌</span>
                <br>桌位名稱：<span class="highlight">${label}</span>
                <br>含同行者：<span class="highlight">共 ${count} 人</span>
            `;
            tableLabel.innerHTML = `第 ${table} 桌<br><span>${label}</span>`;
            generateDots(count);
            tableNoteBelow.style.display = 'block'; 
            window.location.hash = 'result-area';
        }

        resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });

        if (window.parent && window.parent.postMessage) {
            setTimeout(() => {
                const height = document.body.scrollHeight;
                window.parent.postMessage({ height: height, context: 'wedding-seating' }, '*');
            }, 800); 
        }
    }, 100);
}

function clearDots() {
    document.querySelectorAll(".seat-dot").forEach(e => e.remove());
}

function generateDots(count) {
    clearDots();
    const wrapper = document.querySelector(".table-wrapper");
    const radius = 120; 
    const totalSeats = 10; 

    for (let i = 0; i < totalSeats; i++) {
        const dot = document.createElement("div");
        dot.classList.add("seat-dot");
        if (i < count) dot.classList.add("active");
        const angle = (i / totalSeats) * (2 * Math.PI) - (Math.PI / 2); 
        const x = 140 + Math.cos(angle) * radius; 
        const y = 140 + Math.sin(angle) * radius;
        dot.style.left = `${x - 15}px`; 
        dot.style.top  = `${y - 15}px`;
        wrapper.appendChild(dot);
    }
}

/* --- 新增：重新搜尋功能 --- */
function resetSearch() {
    document.getElementById("guestName").value = "";
    document.getElementById("resultText").innerHTML = defaultResultHTML;
    document.getElementById("tableLabel").innerHTML = "";
    document.getElementById("tableNoteBelow").style.display = "none";
    clearDots();
    generateDots(0);
    document.querySelector(".greeting").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}
</script>

　　<div style="margin-top:60px;">
　　<img src="images/table-map.png" class="zoomable" style="width:100%; max-width:600px;">
    </div>

</body>
</html>
